version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: click_smart_chart_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: click_smart_chart_saas
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/click-smart-chart-api
    container_name: click_smart_chart_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/click_smart_chart_saas
      JWT_ACCESS_SECRET: production-access-secret-key-32-chars-minimum
      JWT_REFRESH_SECRET: production-refresh-secret-key-32-chars-minimum
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web/click-smart-chart-web
    container_name: click_smart_chart_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"

volumes:
  mysql_data:
