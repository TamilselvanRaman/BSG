<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bsg-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bsg-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bsg-box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bsg-box-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="bsg-box-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="#0F172A" />

  <!-- BUYING ARROW (Green / Inward / Procurement) -->
  <path d="M 10 18 A 16 16 0 0 1 36 12" stroke="url(#bsg-emerald-grad)" stroke-width="3.2" stroke-linecap="round" />
  <polygon points="37,8 41,13 35,16" fill="#10B981" />

  <!-- SELLING ARROW (Blue / Outward / Sales) -->
  <path d="M 38 30 A 16 16 0 0 1 12 36" stroke="url(#bsg-blue-grad)" stroke-width="3.2" stroke-linecap="round" />
  <polygon points="11,40 7,35 13,32" fill="#3B82F6" />

  <!-- CENTER PRODUCT / GOODS MANAGEMENT CUBE -->
  <polygon points="24,14 32,18.5 24,23 16,18.5" fill="url(#bsg-box-top)" />
  <polygon points="16,18.5 24,23 24,32 16,27.5" fill="url(#bsg-box-left)" />
  <polygon points="24,23 32,18.5 32,27.5 24,32" fill="url(#bsg-box-right)" />
  <line x1="20" y1="16.25" x2="28" y2="20.75" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.8" />
  <line x1="24" y1="23" x2="24" y2="32" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.6" />
  <circle cx="24" cy="23" r="1.5" fill="#34D399" />
</svg>
